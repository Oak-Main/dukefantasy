name: Weekly acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: weekly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check:security-floor
      - run: npm run dataset:build && npm run weekly:verify
      - name: Exercise the weekly source adapters without publishing
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]] || ! git diff --quiet "$BASE_REVISION" HEAD -- scripts/nfl-week-source.mjs scripts/refresh-weekly-edition.mjs scripts/weekly-slate.mjs; then
            node scripts/refresh-weekly-edition.mjs --week= --dry-run
          fi
      - run: npm run verify
      - run: npm run receipt:title
      - run: npm run test:injuries
      - run: npm run test:release
      - run: npm run dataset:verify
        if: github.event_name == 'push'
      - run: npm run dataset:verify:pinned
      - run: npm audit --omit=dev --fetch-retries=0 --fetch-timeout=20000
      - run: npm run deploy:dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-browser-evidence
          path: |
            outputs/injury-mobile
            outputs/week8-browser
  security-release-floor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:security-floor -- --require-vinext
