name: Weekly NFL edition
on:
  schedule:
    # Nov 10 through the Feb 15 cutoff fall in Pacific standard time.
    - cron: "0 14 * * 2"
  workflow_dispatch:
    inputs:
      week:
        description: "Official edition week (blank uses the first unfinished slate and preserves an existing preview)"
        required: false
        type: string
permissions: {}
concurrency:
  group: weekly-nfl-edition
  cancel-in-progress: false
jobs:
  edition:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh from ESPN and the NFL
        id: refresh
        env:
          REQUESTED_WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail
          node scripts/refresh-weekly-edition.mjs --week="$REQUESTED_WEEK"
          if git diff --quiet -- data/content-refresh/current.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.refresh.outputs.changed == 'true'
        run: npm ci
      - name: Verify the dated candidate
        if: steps.refresh.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm run weekly:verify
          npm run dataset:verify
          npm run dataset:verify:pinned
          npm run verify
      - name: Open a draft for owner review
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          day=$(node -p 'require("./data/content-refresh/current.json").sourceAsOf')
          branch="automation/weekly-edition-$day"
          body="data/content-refresh/$day/pr-body.md"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
            # A retry after a successful push must use the already-verified commit and its receipt.
            git fetch --depth=1 origin "refs/heads/$branch"
            git show "FETCH_HEAD:$body" > "$RUNNER_TEMP/edition-receipt.md"
            body="$RUNNER_TEMP/edition-receipt.md"
          else
            git switch -c "$branch"
            git add -- data/content-refresh lib/nfl-generated.ts
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "data: NFL edition $day"
            git push origin "HEAD:refs/heads/$branch"
          fi
          if [[ -z "$(gh pr list --base main --head "$branch" --state all --json number --jq '.[0].number // empty')" ]]; then
            gh pr create --draft --title "Weekly NFL edition $day" --body-file "$body" --base main --head "$branch"
          fi
