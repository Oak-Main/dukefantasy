name: Release DukeFantasy Worker
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Full, reviewed commit SHA currently on main"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dukefantasy-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Require an explicit release of this main revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$REVISION" =~ ^[0-9a-f]{40}$ && "$REVISION" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/install-ci-browsers.sh
      - name: Check current NFL and ESPN source agreement
        run: node scripts/refresh-weekly-edition.mjs --week= --dry-run
      - run: npm run cf:types && npm run dataset:verify:pinned && npm run release:preflight
      - name: Confirm main still points to the reviewed revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$GITHUB_SHA"
      - name: Record current deployment and publish dukefantasy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "820e7cee61fccc60d14c8e20bc686942"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --no-install wrangler deployments list --config wrangler.deploy.jsonc
          npx --no-install wrangler deploy --config wrangler.deploy.jsonc
      - name: Verify the live Worker and both custom domains
        run: node scripts/smoke-release.mjs https://dukefantasy.com "$RUNNER_TEMP/live-release.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dukefantasy-live-release
          path: ${{ runner.temp }}/live-release.json
